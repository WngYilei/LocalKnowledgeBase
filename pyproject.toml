[project]
name = "local-knowledge-base"
version = "0.1.0"
description = "Local document knowledge base with Chroma retrieval, Web UI, and MCP tools"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.0.0",
    "fastapi>=0.115.0",
    "pypdf>=5.1.0",
    "pysqlite3-binary>=0.5.4; platform_system == 'Linux'",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]
local-embedding = ["sentence-transformers>=3.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
